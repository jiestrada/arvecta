map $http_cf_connecting_ip $arvecta_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $binary_remote_addr zone=arvecta_contact:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name arvecta.mx www.arvecta.mx;

    client_max_body_size 32k;
    server_tokens off;

    access_log /var/log/nginx/arvecta.access.log;
    error_log  /var/log/nginx/arvecta.error.log warn;

    location = /api/contact {
        limit_req zone=arvecta_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arvecta_client_ip;
        proxy_set_header X-Forwarded-For $arvecta_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arvecta_client_ip;
        proxy_set_header X-Forwarded-For $arvecta_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arvecta.mx;

    ssl_certificate /etc/arvecta/tls/origin-cert.pem;
    ssl_certificate_key /etc/arvecta/tls/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ARVECTA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://arvecta.mx$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arvecta.mx;

    ssl_certificate /etc/arvecta/tls/origin-cert.pem;
    ssl_certificate_key /etc/arvecta/tls/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ARVECTA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 32k;
    server_tokens off;

    access_log /var/log/nginx/arvecta.access.log;
    error_log  /var/log/nginx/arvecta.error.log warn;

    location = /api/contact {
        limit_req zone=arvecta_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arvecta_client_ip;
        proxy_set_header X-Forwarded-For $arvecta_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arvecta_client_ip;
        proxy_set_header X-Forwarded-For $arvecta_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}
