name: ARVECTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Arvecta.Web.csproj

      - name: Build
        run: dotnet build Arvecta.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Arvecta.Web.csproj --configuration Release --no-build --output ./publish

      - name: Verify published website
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            contacto.html
            empresa.html
            servicios.html
            sectores.html
            aviso-privacidad.html
            terminos.html
            cookies.html
            404.html
            robots.txt
            sitemap.xml
            site.webmanifest
            assets/css/site-v3.css
            assets/css/site-v4.css
            assets/css/legal.css
            assets/js/site-v3.js
            brand/arvecta-logo.png
            brand/arvecta-logo-white.png
          )
          for file in "${required[@]}"; do
            test -f "publish/$file" || { echo "Missing publish/$file"; exit 1; }
          done
          grep -q 'privacyNoticeAccepted' publish/contacto.html
          grep -q 'Aviso de Privacidad Integral' publish/aviso-privacidad.html
          grep -q 'Términos de Uso' publish/terminos.html
          grep -q 'G-DVKX7DGK9T' publish/cookies.html
          grep -q 'arvecta_cookie_consent' publish/assets/js/site-v3.js
          echo "STATIC_PUBLISH=OK"
          echo "LEGAL_PRIVACY=OK"
